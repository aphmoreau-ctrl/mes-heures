<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes Heures">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mes Heures</title>
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#16202e; --muted:#5d6b7e; --line:#d9dfe7;
  --work:#2346a0; --work-soft:#dfe6f7; --sup:#c97d0c; --sup-soft:#f8ead2;
  --pause:#a9b3c1; --ok:#2c7a4b; --ok-soft:#dcefe3; --alert:#b8322a; --alert-soft:#f7dfdc;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10161f; --panel:#1a2230; --ink:#e6eaf0; --muted:#95a1b2; --line:#2b3544;
    --work:#7f9ef2; --work-soft:#223055; --sup:#f2b04a; --sup-soft:#3a2c14;
    --pause:#4b5668; --ok:#6fc893; --ok-soft:#173424; --alert:#ff8f85; --alert-soft:#3c1c1a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--work);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Barre du haut */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:20px;font-weight:750;letter-spacing:-.3px}
.sync{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.sync.err{color:var(--alert);background:var(--alert-soft);border-color:transparent}

main{max-width:620px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:155px;border:0;background:none;padding:9px 0 8px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--work);font-weight:650}

/* Pointeuse (élément fort) */
.punch{padding:14px 2px 6px}
.punch .date{font-size:15px;color:var(--muted);text-transform:none}
.clock{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-weight:800;font-size:76px;line-height:1;letter-spacing:-2px;margin:4px 0 10px}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.state.on .dot{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.state.pause .dot{background:var(--sup)}
.state.done .dot{background:var(--work)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.actions .wide{grid-column:1/-1}
.pbtn{border:0;border-radius:18px;padding:20px 12px;font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.pbtn small{font-size:12.5px;font-weight:500;opacity:.85}
.pbtn:active{transform:scale(.97)}
.pbtn.in{background:var(--work);color:#fff}
.pbtn.out{background:var(--ink);color:var(--bg)}
.pbtn.pause{background:var(--sup-soft);color:var(--sup)}
.pbtn.soft{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:16px;padding:15px 12px}

/* Carte de pointage : ligne de temps */
.tl{position:relative;height:30px;border-radius:8px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/24 - 1px),var(--line) calc(100%/24 - 1px),var(--line) calc(100%/24));background-color:var(--panel);border:1px solid var(--line);overflow:hidden}
.tl.mini{height:10px;border-radius:5px;background:var(--bg);border:0}
.tl .s{position:absolute;top:0;bottom:0;background:var(--work);border-radius:3px}
.tl .s.live{background:repeating-linear-gradient(45deg,var(--work) 0 6px,color-mix(in srgb,var(--work) 70%,transparent) 6px 12px)}
.tl .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--alert)}
.tl-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* Groupes */
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden}
.group > .gh{padding:13px 16px 4px;font-weight:700;font-size:15px}
.gpad{padding:12px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.group > .row:first-child,.gh + .row{border-top:0}
.row .v{font-weight:650}
.row.sup .v{color:var(--sup)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.stats > div{background:var(--panel);padding:12px 10px}
.stats b{display:block;font-size:21px;font-weight:750}
.stats span{font-size:12.5px;color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;display:flex;margin:6px 0 4px}
.bar i{display:block;height:100%}
.bar .n{background:var(--work)} .bar .x{background:var(--sup)}
.alert{margin:10px 0;padding:10px 14px;border-radius:12px;background:var(--alert-soft);color:var(--alert);font-size:14px}
.note{font-size:13px;color:var(--muted);padding:0 16px 12px}

/* Navigation semaine / mois */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 4px}
.nav button{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:44px;height:44px;font-size:20px}
.nav .t{text-align:center}
.nav .t b{display:block;font-size:17px}
.nav .t span{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--work);font-weight:600;padding:6px 0}

/* Jours de la semaine */
.day{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 16px;display:grid;grid-template-columns:62px 1fr auto;gap:4px 12px;align-items:center}
.day:first-of-type{border-top:0}
.day .dn{font-weight:700;line-height:1.15}
.day .dn span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.day .dt{font-size:13.5px;min-width:0}
.day .dh{font-weight:700;text-align:right}
.day .tl{grid-column:2/4}
.day.today .dn{color:var(--work)}
.day.wk{opacity:.8}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--work-soft);color:var(--work);font-weight:600}
.tag.warn{background:var(--alert-soft);color:var(--alert)}

/* Formulaires */
label.l{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-height:44px}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:650;font-size:15.5px;background:var(--work);color:#fff;width:100%;min-height:46px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btns{display:grid;gap:10px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14.5px}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0}
.chips span{display:block;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.chips input:checked + span{background:var(--work);border-color:var(--work);color:#fff;font-weight:600}
.chips input:focus-visible + span{outline:2px solid var(--work);outline-offset:2px}

/* Feuille d'édition */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .bgd{position:absolute;inset:0;background:rgba(10,15,25,.45)}
.sheet .pnl{position:relative;width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet .pnl{animation:none}.pbtn{transition:none}}
.grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 8px}
.shd{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-6px;background:var(--panel);padding:6px 0 8px;z-index:1}
.shd b{font-size:18px}
.seg{display:grid;grid-template-columns:1fr auto 1fr 40px;gap:8px;align-items:center;margin-bottom:6px}
.seg .x{border:0;background:var(--alert-soft);color:var(--alert);border-radius:10px;height:44px}
.seg .src{grid-column:1/-1;font-size:12px;color:var(--muted);margin:-2px 0 6px 2px}
.tm{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.tm > span{font-weight:600;font-size:14.5px}
.nowb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;height:44px;font-size:13.5px;color:var(--work);font-weight:600}
.pz{border-left:3px solid var(--sup);padding-left:10px;margin:4px 0 8px}
.pz .tm{grid-template-columns:86px 1fr auto}
.cols > div{min-width:0}
@media (min-width:860px){
  main{max-width:1060px;padding-left:24px;padding-right:24px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}
  .punch{padding-top:24px}
  .clock{font-size:96px}
}
@media (display-mode:standalone) and (min-width:600px){ .top{padding-left:100px} }
.chipb{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:14px;color:var(--ink)}
.prm{border-left:3px solid var(--work);padding-left:10px;margin:6px 0 12px}
.calc{margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:var(--work-soft);font-size:14px;line-height:1.55}
td.pos{color:var(--alert);font-weight:700}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.hist div{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:11px 14px 11px 16px;border-radius:12px;font-size:14.5px;display:none;align-items:center;gap:14px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{display:flex}
#toast button{border:0;background:none;color:var(--sup);font-weight:700;padding:4px}

table.wk{width:100%;border-collapse:collapse;font-size:13.5px}
table.wk th,table.wk td{padding:9px 8px;text-align:right;border-top:1px solid var(--line)}
table.wk th:first-child,table.wk td:first-child{text-align:left;padding-left:16px}
table.wk th:last-child,table.wk td:last-child{padding-right:16px}
table.wk th{font-weight:600;color:var(--muted);font-size:12.5px;border-top:0}
.scroll{overflow-x:auto}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:14.5px}
ol.steps li{margin:4px 0}
</style>
</head>
<body>
<header class="top">
  <h1>Mes Heures</h1>
  <span id="sync" class="sync">Sur l'appareil</span>
</header>
<main id="view"></main>
<nav class="tabs" aria-label="Navigation">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Pointer</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semaine</button>
  <button data-tab="recap"><svg viewBox="0 0 24 24"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>Récap</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
</nav>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= Outils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmt = m => { m = Math.round(m); const s = m < 0 ? '-' : ''; m = Math.abs(m); return s + Math.floor(m/60) + 'h' + pad(m%60); };
const dec = m => (Math.round(m/60*100)/100).toFixed(2).replace('.', ',');
const eur = v => v.toLocaleString('fr-FR', {style:'currency', currency:'EUR'}).replace(/[\u202f\u00a0]/g, ' ');
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
const monday = s => { const d = pd(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); };
const isoWeek = s => { const d = pd(s); d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1)/864e5 - 3 + ((w1.getDay()+6)%7))/7); };
const frLong = s => { const t = pd(s).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); };
const frDM = s => pd(s).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const frNum = s => pd(s).toLocaleDateString('fr-FR');
const frDay = s => pd(s).toLocaleDateString('fr-FR', {weekday:'short'}).replace('.', '');
const stampTxt = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('fr-FR') + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const numIn = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };

const TYPES = {
  travail: {l:'Travail'},
  conge:   {l:'Congé payé', abs:1},
  rtt:     {l:'RTT', abs:1},
  ferie:   {l:'Férié chômé', abs:1},
  recup:   {l:'Récupération', abs:1},
  maladie: {l:'Arrêt maladie'},
  absence: {l:'Absence'},
  repos:   {l:'Repos'}
};

/* ================= Données ================= */
const DEF_SET = {nom:'', employeur:'', poste:'', base:35, seuil:43, t1:25, t2:50, taux:0, contingent:220, grande:false, credit:false, creditH:7, remu:[], debut:'', fin:'', contrat:'CDI', convention:'', updatedAt:''};
let S = load();
function load() {
  try { const o = JSON.parse(localStorage.getItem('mh_data') || '{}'); return {settings:{...DEF_SET, ...(o.settings||{})}, days:o.days || {}, paie:o.paie || {}, dels:o.dels || {}}; }
  catch (e) { return {settings:{...DEF_SET}, days:{}, paie:{}, dels:{}}; }
}
function persist() {
  try { localStorage.setItem('mh_data', JSON.stringify(S)); }
  catch (e) { toast("Enregistrement impossible sur l'appareil : exportez une sauvegarde."); }
}
const blankDay = ds => ({date:ds, type:'travail', segs:[], lieu:'', note:'', closed:false, createdAt:'', updatedAt:'', hist:[]});
function stamp(d) { const n = new Date().toISOString(); if (!d.createdAt) d.createdAt = n; d.updatedAt = n; }
const dt = (ds, hm) => { const x = pd(ds); const [h,m] = hm.split(':').map(Number); x.setHours(h, m, 0, 0); return x; };
const sorted = d => [...(d.segs||[])].sort((a,b) => toMin(a.d) - toMin(b.d));
function segEnd(ds, s) { if (!s.f) return null; const e = dt(ds, s.f); if (e < dt(ds, s.d)) e.setDate(e.getDate()+1); return e; }
function segMin(ds, s, now) {
  const st = dt(ds, s.d); const en = s.f ? segEnd(ds, s) : now;
  return en ? Math.max(0, Math.round((en - st)/60000)) : 0;
}
const dayEff = (d, now) => (d.segs||[]).reduce((a, s) => a + segMin(d.date, s, now), 0);
const inContract = ds => { const st = S.settings; return (!st.debut || ds >= st.debut) && (!st.fin || ds <= st.fin); };
const contratTxt = () => { const st = S.settings; if (!st.debut && !st.fin) return ''; return (st.contrat || 'Contrat') + (st.debut ? ' depuis le ' + frNum(st.debut) : '') + (st.fin ? (st.debut ? ' jusqu’au ' : ' terminé le ') + frNum(st.fin) : ''); };
const dayCredit = d => (TYPES[d.type] && TYPES[d.type].abs && S.settings.credit) ? S.settings.creditH*60 : 0;
function dayPause(d) {
  const ss = sorted(d); let p = 0;
  for (let i = 0; i < ss.length-1; i++) { const e = segEnd(d.date, ss[i]); if (!e) continue; const g = (dt(d.date, ss[i+1].d) - e)/60000; if (g > 0) p += g; }
  return Math.round(p);
}
function bounds(ds) {
  const d = S.days[ds]; if (!d || !d.segs.length) return null;
  const ss = sorted(d); return {st:dt(ds, ss[0].d), en:segEnd(ds, ss[ss.length-1])};
}
function dayAlerts(ds, now) {
  const d = S.days[ds]; const out = []; if (!d || !d.segs.length) return out;
  if (dayEff(d, now) > 600) out.push('Plus de 10 h travaillées');
  const b = bounds(ds), p = bounds(addD(ds, -1));
  if (b && p && p.en) { const r = (b.st - p.en)/60000; if (r < 660) out.push('Repos de ' + fmt(r) + ' depuis la veille (moins de 11 h)'); }
  return out;
}
function srcTxt(d) {
  const set = [...new Set((d.segs||[]).flatMap(s => s.srcF ? [s.src, s.srcF] : [s.src]))];
  if (!set.length) return d.type === 'travail' ? '' : 'manuel';
  return set.length === 1 ? set[0] : set.join(' + ');
}

/* ================= Calculs ================= */
function weekStats(mon, now) {

  return out;
}

}

/* Rémunération : taux horaire en vigueur à une date */

const remuList = () => [...(S.settings.remu||[])].sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
function remuAt(ds) { const l = remuList().filter(r => r.from <= ds); return l.length ? l[l.length-1] : null; }
function tauxAt(ds) { const r = remuAt(ds); return r ? remuTaux(r) : (+S.settings.taux || 0); }
/* Mois et fiche de paie */
function monthStats(y, m, now) {
  const first = ymd(new Date(y, m, 1)), last = ymd(new Date(y, m+1, 0));
  let effM = 0, nbT = 0; const cnt = {};
  for (let ds = first; ds <= last; ds = addD(ds, 1)) {
    const d = S.days[ds]; if (!d || !inContract(ds)) continue;
    const e = dayEff(d, now); effM += e; if (e > 0) nbT++;

function paieCmp(ms) {

function readSheet() {
  const d = ed.day, f = ed.form;
  const r = document.querySelector('input[name=etype]:checked'); if (r) d.type = r.value;

function closeSheet() { $('#sheet').classList.add('hidden'); $('#sheet').innerHTML = ''; ed = null; red = null; if (pendingRender) setTimeout(softRender, 50); }
function buildSegs() { // formulaire -> périodes de travail ; renvoie un message d'erreur ou null
  const f = ed.form, d = ed.day, live = ed.ds >= addD(today(), -1);
  const ps = f.pauses.filter(p => p.d || p.f);
  if (!f.arr) {
    if (f.dep || ps.length) return 'Indiquez l’heure d’arrivée.';
    d.segs = []; d.closed = false; return null;
  }
  if (ps.some(p => !p.d)) return 'Indiquez le début de chaque pause.';
  ps.sort((a, b) => toMin(a.d) - toMin(b.d));
  const openP = ps.filter(p => !p.f);
  if (openP.length > 1 || (openP.length && (openP[0] !== ps[ps.length-1] || f.dep))) return 'Seule la dernière pause peut rester sans fin, et seulement sans heure de départ.';
  if (!f.dep && !openP.length && !live) return 'Indiquez l’heure de départ.';
  if (openP.length && !live) return 'Indiquez la fin de la pause.';
  let prev = toMin(f.arr);
  for (const p of ps) {
    if (toMin(p.d) <= prev) return 'Les pauses doivent être après l’arrivée et dans l’ordre.';
    if (p.f && toMin(p.f) < toMin(p.d)) return 'La fin de pause doit être après son début.';
    prev = p.f ? toMin(p.f) : toMin(p.d);
  }
  if (f.dep && ps.length && toMin(f.dep) <= prev) return 'Le départ doit être après la dernière pause.';
  const segs = []; let start = f.arr;
  for (const p of ps) { segs.push({d:start, f:p.d}); start = p.f || null; }
  if (start) segs.push({d:start, f:f.dep || ''});
  const old = ed.orig ? sorted(ed.orig) : [], now = new Date().toISOString(); let changed = false;
  d.segs = segs.map((s, i) => {
    const o = old[i];
    if (!o) return {id:uid(), d:s.d, f:s.f, src:'manuel', at:now};
    const n = {...o, d:s.d, f:s.f};
    const modif = o.d !== s.d || (o.f && o.f !== s.f);
    if (modif) { changed = true; if (o.src !== 'manuel') n.src = 'corrigé'; }
    else if (!o.f && s.f && o.src === 'pointé') n.srcF = 'manuel';
    return n;
  });
  if (old.length > segs.length) changed = true;
  ed.modif = changed;
  d.closed = !!f.dep;
  return null;
}
function saveEditor() {
  readSheet(); const d = ed.day, now = new Date().toISOString();
  const err = buildSegs(); if (err) return toast(err);
  const before = ed.orig ? summary(ed.orig) : null, after = summary(d);
  const noteChg = ed.orig && (ed.orig.lieu !== d.lieu || ed.orig.note !== d.note);
  const typeChg = ed.orig && ed.orig.type !== d.type;
  if (ed.orig && before === after && !noteChg && ed.orig.closed === d.closed) { closeSheet(); return; }
  if (!ed.orig && !d.segs.length && d.type === 'travail' && !d.lieu && !d.note) { closeSheet(); return; }
  if (!ed.orig) d.hist.push({at:now, act:'Saisie manuelle', apres:after});
  else if (before !== after) d.hist.push({at:now, act:(ed.modif || typeChg) ? 'Correction' : 'Complément', avant:before, apres:after});
  else if (noteChg) d.hist.push({at:now, act:'Lieu ou note modifié'});
  stamp(d); S.days[ed.ds] = d; const ds = ed.ds; closeSheet(); saveDay(ds); toast('Journée enregistrée');
}

function loadScript(src) {

  try { if (!window.jspdf) await loadScript(LIB_PDF); await loadScript(LIB_TAB); return !!(window.jspdf && window.jspdf.jsPDF.API.autoTable); }

}
async function deliver(blob, name, type) {

    catch (e) { if (e.name === 'AbortError') return; }

  const url = URL.createObjectURL(blob), a = document.createElement('a');

  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function period() {

    for (const [k, v] of Object.entries(S.paie)) { if (!rp[k] || (v.updatedAt || '') > (rp[k].updatedAt || '')) pUp = true; }
    if (pUp) pushPaie();
    persist(); fb.err = false; fb.last = new Date(); if (changed) render();
  } catch (e) { fb.err = true; }
  fb.busy = false; setSync();
}
let unsubs = [], pendingRender = false;
function softRender() { if (ed || red || $('#view').contains(document.activeElement)) { pendingRender = true; return; } pendingRender = false; render(); }
function listen() { // synchronisation instantanée entre appareils
  unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = [];
  if (!fb.user) return;
  const onErr = () => { fb.err = true; setSync(); };
  unsubs.push(ucol().collection('days').onSnapshot(snap => {
    let ch = false;
    snap.docChanges().forEach(c => { if (c.type === 'removed' || c.doc.metadata.hasPendingWrites) return; if (mergeDay(c.doc.id, c.doc.data())) ch = true; });
    if (!snap.metadata.fromCache) { fb.last = new Date(); fb.err = false; }
    if (ch) { persist(); softRender(); } setSync();
  }, onErr));
  unsubs.push(ucol().collection('meta').doc('settings').onSnapshot(d => {
    if (!d.exists || d.metadata.hasPendingWrites) return; const r = d.data();
    if ((r.updatedAt || '') > (S.settings.updatedAt || '')) { S.settings = {...DEF_SET, ...r}; persist(); softRender(); }
  }, onErr));
  unsubs.push(ucol().collection('meta').doc('paie').onSnapshot(d => {
    if (!d.exists || d.metadata.hasPendingWrites) return; let ch = false;
    for (const [k, v] of Object.entries(d.data().months || {})) { const l = S.paie[k]; if (!l || (v.updatedAt || '') > (l.updatedAt || '')) { S.paie[k] = v; ch = true; } }
    if (ch) { persist(); softRender(); }
  }, onErr));
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) softRender(); }, 400));
function setSync() {
  const el = $('#sync'); if (!el) return; let t = 'Sur l’appareil', c = '';
  if (localStorage.getItem('mh_fbcfg')) {
    if (!fb.ready) t = fb.failed ? 'Hors ligne' : 'Connexion…';
    else if (!fb.user) t = 'Non connecté';
    else if (fb.err) { t = 'Erreur de synchro'; c = 'err'; }
    else if (fb.busy || fb.pending > 0) t = navigator.onLine ? 'Synchro…' : 'Hors ligne, en attente';
    else { t = 'Sauvegardé en ligne'; c = 'ok'; }
  }
  el.textContent = t; el.className = 'sync ' + c;
}
function fbErr(e) {
  const m = {'auth/invalid-email':'Adresse e-mail invalide.', 'auth/missing-password':'Indiquez un mot de passe.', 'auth/weak-password':'Mot de passe trop court (6 caractères minimum).',
    'auth/email-already-in-use':'Un compte existe déjà avec cet e-mail : utilisez « Se connecter ».', 'auth/invalid-credential':'E-mail ou mot de passe incorrect.',
    'auth/wrong-password':'E-mail ou mot de passe incorrect.', 'auth/user-not-found':'Aucun compte avec cet e-mail.', 'auth/network-request-failed':'Pas de connexion internet.',
    'auth/operation-not-allowed':'Activez « E-mail/Mot de passe » dans Firebase > Authentication.', 'auth/too-many-requests':'Trop de tentatives, réessayez plus tard.'};
  toast(m[e.code] || ('Erreur : ' + (e.code || e.message)));
}

/* ================= Événements ================= */
document.addEventListener('click', async e => {
  const tb = e.target.closest('.tabs button');
  if (tb) { tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case 'in': case 'pause': case 'out': case 'finish': punch(act); break;
    case 'undo': if (undoFn) { const f = undoFn; undoFn = null; f(); toast('Pointage annulé'); } break;
    case 'edit': openEditor(b.dataset.ds); break;
    case 'other': { const v = $('#otherDay').value; if (v) openEditor(v); break; }
    case 'shut': closeSheet(); break;
    case 'addpause': readSheet(); ed.form.pauses.push({d:'', f:''}); renderSheet(); break;
    case 'delpause': readSheet(); ed.form.pauses.splice(+b.dataset.i, 1); renderSheet(); break;
    case 'now': { const i = b.previousElementSibling; if (i) i.value = nowHM(); break; }
    case 'save': saveEditor(); break;
    case 'delday': if (confirm('Supprimer définitivement cette journée sur tous vos appareils ?')) { const ds = ed.ds; closeSheet(); delDay(ds); toast('Journée supprimée'); } break;
    case 'remu': openRemu(+b.dataset.i); break;
    case 'remunew': openRemu(null); break;
    case 'addprime': readRemu(); red.r.primes = red.r.primes || []; red.r.primes.push({l:'', m:'', inc:true}); renderRemu(); break;
    case 'delprime': readRemu(); red.r.primes.splice(+b.dataset.i, 1); renderRemu(); break;
    case 'saveremu': saveRemu(); break;
    case 'delremu': if (confirm('Supprimer cette rémunération ?')) { S.settings.remu.splice(red.i, 1); S.settings.updatedAt = new Date().toISOString(); persist(); pushSettings(); closeSheet(); render(); toast('Rémunération supprimée'); } break;
    case 'savepaie': {
      const k = `${rMonth.y}-${pad(rMonth.m+1)}`, h25 = parseHM($('#p25').value), h50 = parseHM($('#p50').value), mt = $('#pm').value.trim();
      if (h25 === undefined || h50 === undefined) return toast('Heures non reconnues : écrivez par exemple 17h20 ou 17,33.');
      const empty = h25 == null && h50 == null && !mt;
      S.paie[k] = {h25:empty ? null : (h25 || 0), h50:empty ? null : (h50 || 0), m:mt ? numIn(mt) : null, updatedAt:new Date().toISOString()};
      persist(); pushPaie(); render(); toast(empty ? 'Fiche de paie effacée' : 'Fiche de paie enregistrée'); break;
    }
    case 'wprev': weekMon = addD(weekMon, -7); render(); break;
    case 'wnext': weekMon = addD(weekMon, 7); render(); break;
    case 'wnow': weekMon = monday(today()); render(); break;
    case 'mprev': case 'mnext': {
      const d = new Date(rMonth.y, rMonth.m + (act === 'mprev' ? -1 : 1), 1); rMonth = {y:d.getFullYear(), m:d.getMonth()};
      exFrom = ymd(d); const l = ymd(new Date(d.getFullYear(), d.getMonth()+1, 0)); exTo = l > today() ? today() : l; render(); break;
    }
    case 'pdf': b.disabled = true; try { await exportPdf(); } catch (err) { toast('Création du PDF impossible : ' + err.message); } b.disabled = false; break;
    case 'csv': exportCsv(); break;
    case 'exmonth': case 'exyear': case 'exall': case 'ex3y': {
      const st = S.settings, ref = st.fin && st.fin < today() ? st.fin : today(); let a, z = ref;
      if (act === 'exmonth') { a = ymd(new Date(rMonth.y, rMonth.m, 1)); z = ymd(new Date(rMonth.y, rMonth.m+1, 0)); if (z > ref) z = ref; }
      if (act === 'exyear') { a = rMonth.y + '-01-01'; z = rMonth.y + '-12-31'; if (z > ref) z = ref; }
      if (act === 'exall') a = st.debut;
      if (act === 'ex3y') { const d = pd(ref); d.setFullYear(d.getFullYear() - 3); d.setDate(d.getDate() + 1); a = ymd(d); }
      if (st.debut && a < st.debut) a = st.debut;
      exFrom = a; exTo = z; render(); toast(`Période : du ${frNum(a)} au ${frNum(z)}`); break;
    }
    case 'backup': exportBackup(); break;
    case 'restore': $('#restoreFile').click(); break;
    case 'saveset': {
      const st = S.settings;
      st.debut = $('#s-deb').value; st.fin = $('#s-fin').value; if (st.debut && st.fin && st.fin < st.debut) return toast('La fin de contrat doit être après la date d’entrée.');
      st.contrat = $('#s-ctr').value; st.convention = $('#s-conv').value.trim();
      st.nom = $('#s-nom').value.trim(); st.poste = $('#s-poste').value.trim(); st.employeur = $('#s-emp').value.trim();
      st.base = numIn($('#s-base').value) || 35; st.seuil = Math.max(st.base, numIn($('#s-seuil').value) || st.base);
      st.t1 = numIn($('#s-t1').value); st.t2 = numIn($('#s-t2').value); st.grande = $('#s-grande').checked;
      st.contingent = numIn($('#s-cont').value) || 220; st.credit = $('#s-credit').checked; st.creditH = numIn($('#s-ch').value) || 7;
      st.updatedAt = new Date().toISOString(); persist(); pushSettings(); render(); toast('Réglages enregistrés'); break;
    }
    case 'fbcfg': {
      const c = parseCfg($('#fbcfg').value); if (!c) return toast('Configuration incomplète : il faut au moins apiKey, projectId et appId.');
      localStorage.setItem('mh_fbcfg', JSON.stringify(c)); render(); fbStart(); break;
    }
    case 'fblogin': try { await fb.auth.signInWithEmailAndPassword($('#fbmail').value.trim(), $('#fbpass').value); toast('Connecté'); } catch (err) { fbErr(err); } break;
    case 'fbsignup': try { await fb.auth.createUserWithEmailAndPassword($('#fbmail').value.trim(), $('#fbpass').value); toast('Compte créé, sauvegarde activée'); } catch (err) { fbErr(err); } break;
    case 'fbreset': { const m = $('#fbmail').value.trim(); if (!m) return toast('Indiquez d’abord votre e-mail.'); try { await fb.auth.sendPasswordResetEmail(m); toast('E-mail de réinitialisation envoyé'); } catch (err) { fbErr(err); } break; }
    case 'fbsync': await fullSync(); toast(fb.err ? 'Synchronisation impossible pour le moment' : 'Synchronisé'); render(); break;
    case 'fblogout': if (confirm('Se déconnecter ? Les données restent sur ce téléphone.')) { await fb.auth.signOut(); render(); } break;
    case 'fbforget': if (confirm('Retirer la configuration Firebase ? Vos données restent sur ce téléphone et en ligne.')) { localStorage.removeItem('mh_fbcfg'); location.reload(); } break;
  }
});
$('#restoreFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (ed || red)) closeSheet(); });
document.addEventListener('input', e => { if (red && e.target.closest('#sheet')) { readRemu(); updRemuCalc(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (!ed && !red && !$('#view').contains(document.activeElement)) render(); fullSync(); } });
window.addEventListener('online', () => { setSync(); fullSync(); });
window.addEventListener('offline', setSync);
setInterval(() => {
  const c = $('#clock'); if (c) c.textContent = nowHM();
  if (tab === 'today' && !ed && !red && !$('#view').contains(document.activeElement)) render();
}, 20000);

/* ================= Démarrage ================= */
render();
fbStart();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
