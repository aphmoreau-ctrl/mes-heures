<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes Heures">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mes Heures</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#101828; --muted:#667085; --line:#e4e7ec;
  --work:#1e3a8a; --work-soft:#e0e7f6; --sup:#c97d0c; --sup-soft:#f8ead2;
  --pause:#a9b3c1; --ok:#2c7a4b; --ok-soft:#dcefe3; --alert:#b8322a; --alert-soft:#f7dfdc;
  --radius:14px; --hero:#101828;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10161f; --panel:#1a2230; --ink:#e6eaf0; --muted:#95a1b2; --line:#2b3544;
    --work:#7f9ef2; --work-soft:#223055; --sup:#f2b04a; --sup-soft:#3a2c14;
    --pause:#4b5668; --ok:#6fc893; --ok-soft:#173424; --alert:#ff8f85; --alert-soft:#3c1c1a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--work);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Barre du haut */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:20px;font-weight:750;letter-spacing:-.3px}
.sync{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.sync.err{color:var(--alert);background:var(--alert-soft);border-color:transparent}

main{max-width:620px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Onglets */
.top{display:block!important;padding-bottom:0!important}
.hrow1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdate{font-size:12px;color:var(--muted);font-weight:500}
.hname{font-size:20px;font-weight:700;letter-spacing:-.4px}
.hright{display:flex;align-items:center;gap:8px}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;color:var(--ink);padding:0}
.avatar.on{background:var(--work);color:#fff;border-color:var(--work)}
.spt{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-top:10px}
.spt button{border:0;background:none;padding:10px 0;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.spt button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--work)}
body{font-family:Inter,-apple-system,system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
.gh{font-size:11px!important;font-weight:600!important;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)!important}
.hero{background:var(--hero);color:#fff;border-radius:16px;padding:16px;margin:14px 0 12px;display:flex;flex-direction:column;gap:11px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hlab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#98a2b3}
.hchip{font-size:11.5px;font-weight:600;color:#d0d5dd;border:1px solid #344054;border-radius:999px;padding:3px 9px}
.hbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.hbig b{font-size:38px;letter-spacing:-1px;font-weight:700}.hbig span{font-size:14px;color:#98a2b3}
.hbar{height:6px;background:#344054;border-radius:99px;overflow:hidden}.hbar i{display:block;height:6px;background:#fff;border-radius:99px}
.hsub{font-size:13px;color:#d0d5dd}.hsub b{color:#fff}
.hact{display:grid;grid-template-columns:1fr 52px;gap:8px;align-items:stretch}
.hero .actions{margin:0;gap:8px}
.hero .pbtn{border-radius:12px;padding:13px 10px;font-size:16px}
.hero .pbtn small{display:none}
.hero .pbtn.in,.hero .pbtn.out{background:#fff;color:var(--hero)}
.hero .pbtn.pause,.hero .pbtn.soft{background:transparent;border:1px solid #344054;color:#fff}
.hcam{border:1px solid #344054;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0;min-height:48px}
.hcam svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 4px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink);font-family:inherit}
.kl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-size:24px;letter-spacing:-.6px}.kpi b small{font-size:15px;color:#98a2b3;font-weight:600}
.ks{font-size:12px;color:#475467}.ks em{font-style:normal;color:#b54708;font-weight:600}.ks.warn{color:#b54708;font-weight:600}
.kbar{height:4px;background:#eaecf0;border-radius:99px;margin-top:6px;display:block}.kbar i{display:block;height:4px;background:var(--work);border-radius:99px}
.wdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:middle}.wdot.r{background:#d92d20}.wdot.o{background:#f79009}.wdot.g{background:#12b76a}
.kpis.k3{grid-template-columns:repeat(3,1fr);margin-top:4px}.k3 .kpi{padding:11px}.k3 .kpi b{font-size:20px}
.rowb{width:100%;border:0;background:none;font-family:inherit;color:inherit;text-align:left}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--hero:#0b111b} .ks{color:var(--muted)} .kbar{background:#2b3544} }
.spt.hidden,#homeb.hidden{display:none}
body.home main{padding-bottom:30px}
.homew{display:flex;flex-direction:column;gap:12px;padding-top:16px}
.hcard{border:0;border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;color:#fff;font-family:inherit;min-height:170px}
.hblue{background:#101828}.hteal{background:#0f5f58}
.hctop{display:flex;justify-content:space-between;align-items:center}
.hcic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.hcic svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hcgo{font-size:26px;opacity:.7}
.hctitle{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-top:4px}
.hcline{font-size:14px;color:rgba(255,255,255,.82)}
.hcstats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:rgba(255,255,255,.75);margin-top:2px}.hcstats b{color:#fff;font-size:14px}
.hmini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spc{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px}
.spc button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:700;font-size:15px;color:var(--muted)}
.spc button.on{background:var(--work);color:#fff}
.tabs.hidden{display:none}
body.spj{--work:#0f766e;--work-soft:#d4eeea}
@media (prefers-color-scheme:dark){ body.spj{--work:#4fc4b6;--work-soft:#12312d} }
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:155px;border:0;background:none;padding:9px 0 8px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--work);font-weight:650}

/* Pointeuse (élément fort) */
.punch{padding:14px 2px 6px}
.punch .date{font-size:15px;color:var(--muted);text-transform:none}
.clock{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-weight:800;font-size:76px;line-height:1;letter-spacing:-2px;margin:4px 0 10px}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.state.on .dot{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.state.pause .dot{background:var(--sup)}
.state.done .dot{background:var(--work)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.actions .wide{grid-column:1/-1}
.pbtn{border:0;border-radius:18px;padding:20px 12px;font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.pbtn small{font-size:12.5px;font-weight:500;opacity:.85}
.pbtn:active{transform:scale(.97)}
.pbtn.in{background:var(--work);color:#fff}
.pbtn.out{background:var(--ink);color:var(--bg)}
.pbtn.pause{background:var(--sup-soft);color:var(--sup)}
.pbtn.soft{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:16px;padding:15px 12px}

/* Carte de pointage : ligne de temps */
.tl{position:relative;height:30px;border-radius:8px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/24 - 1px),var(--line) calc(100%/24 - 1px),var(--line) calc(100%/24));background-color:var(--panel);border:1px solid var(--line);overflow:hidden}
.tl.mini{height:10px;border-radius:5px;background:var(--bg);border:0}
.tl .s{position:absolute;top:0;bottom:0;background:var(--work);border-radius:3px}
.tl .s.live{background:repeating-linear-gradient(45deg,var(--work) 0 6px,color-mix(in srgb,var(--work) 70%,transparent) 6px 12px)}
.tl .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--alert)}
.tl-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* Groupes */
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden}
.group > .gh{padding:13px 16px 4px;font-weight:700;font-size:15px}
.gpad{padding:12px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.group > .row:first-child,.gh + .row{border-top:0}
.row .v{font-weight:650}
.row.sup .v{color:var(--sup)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.stats > div{background:var(--panel);padding:12px 10px}
.stats b{display:block;font-size:21px;font-weight:750}
.stats span{font-size:12.5px;color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;display:flex;margin:6px 0 4px}
.bar i{display:block;height:100%}
.bar .n{background:var(--work)} .bar .x{background:var(--sup)}
.alert{margin:10px 0;padding:10px 14px;border-radius:12px;background:var(--alert-soft);color:var(--alert);font-size:14px}
.note{font-size:13px;color:var(--muted);padding:0 16px 12px}

/* Navigation semaine / mois */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 4px}
.nav button{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:44px;height:44px;font-size:20px}
.nav .t{text-align:center}
.nav .t b{display:block;font-size:17px}
.nav .t span{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--work);font-weight:600;padding:6px 0}

/* Jours de la semaine */
.day{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 16px;display:grid;grid-template-columns:62px 1fr auto;gap:4px 12px;align-items:center}
.day:first-of-type{border-top:0}
.day .dn{font-weight:700;line-height:1.15}
.day .dn span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.day .dt{font-size:13.5px;min-width:0}
.day .dh{font-weight:700;text-align:right}
.day .tl{grid-column:2/4}
.day.today .dn{color:var(--work)}
.day.wk{opacity:.8}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--work-soft);color:var(--work);font-weight:600}
.tag.warn{background:var(--alert-soft);color:var(--alert)}

/* Formulaires */
label.l{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-height:44px}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:650;font-size:15.5px;background:var(--work);color:#fff;width:100%;min-height:46px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btns{display:grid;gap:10px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14.5px}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0}
.chips span{display:block;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.chips input:checked + span{background:var(--work);border-color:var(--work);color:#fff;font-weight:600}
.chips input:focus-visible + span{outline:2px solid var(--work);outline-offset:2px}

/* Feuille d'édition */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .bgd{position:absolute;inset:0;background:rgba(10,15,25,.45)}
.sheet .pnl{position:relative;width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet .pnl{animation:none}.pbtn{transition:none}}
.grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 8px}
.shd{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-6px;background:var(--panel);padding:6px 0 8px;z-index:1}
.shd b{font-size:18px}
.seg{display:grid;grid-template-columns:1fr auto 1fr 40px;gap:8px;align-items:center;margin-bottom:6px}
.seg .x{border:0;background:var(--alert-soft);color:var(--alert);border-radius:10px;height:44px}
.seg .src{grid-column:1/-1;font-size:12px;color:var(--muted);margin:-2px 0 6px 2px}
.tm{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.tm > span{font-weight:600;font-size:14.5px}
.nowb{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;height:44px;font-size:13.5px;color:var(--work);font-weight:600}
.pz{border-left:3px solid var(--sup);padding-left:10px;margin:4px 0 8px}
.pz .tm{grid-template-columns:86px 1fr auto}
.cols > div{min-width:0}
.dayw{border-top:1px solid var(--line)}
.dayw:first-child{border-top:0}
.dayw .day{border-top:0}
.dayw.today .dn{color:var(--work)}
.dayw.wk{opacity:.85}
.qk{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px 90px}
.qk button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink)}
.qk button.on{background:var(--work);border-color:var(--work);color:#fff;font-weight:600}
.pz.abs{border-left-color:var(--alert)}
.sumb{display:inline-block;font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--work-soft);color:var(--work);margin-bottom:10px}
select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-height:44px}
@media (max-width:420px){ .qk{padding-left:16px} }
@media (min-width:860px){
  main{max-width:1060px;padding-left:24px;padding-right:24px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}
  .punch{padding-top:24px}
  .clock{font-size:96px}
}
@media (display-mode:standalone) and (min-width:600px){ .top{padding-left:100px} }
.ndot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.ndot.big{width:14px;height:14px}
.ndots .ndot{margin-right:3px}
.nrow{border-left:3px solid var(--line);padding-left:10px;margin:6px 0 12px}
.nrow textarea{margin-top:8px;min-height:64px}
.xrow{border-left:3px solid var(--sup);padding-left:10px;margin:6px 0 12px}
.mline{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px;color:var(--ink)}
.mline.hidden{display:none}
#ask{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center}
#ask .bgd{position:absolute;inset:0;background:rgba(10,15,25,.45)}
.askbox{position:relative;background:var(--panel);border-radius:16px;padding:18px;width:min(380px,90vw);display:flex;flex-direction:column;gap:12px}
.chipb.on{background:var(--work);border-color:var(--work);color:#fff;font-weight:600}
details.pfx{margin-top:12px}
details.pfx summary{font-weight:600;font-size:14.5px;color:var(--work);cursor:pointer;padding:6px 0}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center}
.lockbox{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(300px,86vw);text-align:center}
.lockbox input{text-align:center;font-size:22px;letter-spacing:6px}
.tabs button{max-width:130px}
.jrph{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:8px}
.jrth{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.jrth img{width:100%;height:100%;object-fit:cover}
.jrth .x{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.segv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:8px 0 4px}
.segv button{border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:600;color:var(--muted)}
.segv button.on{background:var(--work);color:#fff}
.stb{display:flex;gap:5px}
.stb button{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:700;color:var(--muted)}
.stb button.on.fait{background:var(--ok);border-color:var(--ok);color:#fff}
.stb button.on.pasfait{background:var(--alert);border-color:var(--alert);color:#fff}
.stb button.on.partiel{background:var(--sup);border-color:var(--sup);color:#fff}
.stb button.on.attente{background:var(--work-soft);border-color:var(--work);color:var(--work)}
.lrow{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;margin-bottom:6px}

<script>
'use strict';
/* ================= Outils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmt = m => { m = Math.round(m); const s = m < 0 ? '-' : ''; m = Math.abs(m); return s + Math.floor(m/60) + 'h' + pad(m%60); };
const dec = m => (Math.round(m/60*100)/100).toFixed(2).replace('.', ',');
const eur = v => v.toLocaleString('fr-FR', {style:'currency', currency:'EUR'}).replace(/[\u202f\u00a0]/g, ' ');
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
const monday = s => { const d = pd(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); };
const isoWeek = s => { const d = pd(s); d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1)/864e5 - 3 + ((w1.getDay()+6)%7))/7); };
const frLong = s => { const t = pd(s).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); };
const frDM = s => pd(s).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const frNum = s => pd(s).toLocaleDateString('fr-FR');
const frDay = s => pd(s).toLocaleDateString('fr-FR', {weekday:'short'}).replace('.', '');
const stampTxt = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('fr-FR') + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const numIn = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };

const CATS = {travail:'Travail', repos:'Repos', conge:'Congé payé', autre:'Autre absence'};
const TYPES = {
  travail:        {l:'Travail', cat:'travail'},
  formation:      {l:'Formation', cat:'travail'},
  deplacement:    {l:'Déplacement professionnel', cat:'travail'},
  solidarite:     {l:'Journée de solidarité', cat:'travail'},
  repos:          {l:'Repos hebdomadaire', cat:'repos'},
  rtt:            {l:'RTT / repos forfait', cat:'repos', abs:1},
  recup:          {l:'Récupération / repos compensateur', cat:'repos', abs:1},
  ferie:          {l:'Férié chômé', cat:'repos', abs:1},
  conge:          {l:'Congé payé', cat:'conge', abs:1},
  anciennete:     {l:'Congé d’ancienneté', cat:'conge', abs:1},
  fractionnement: {l:'Jour de fractionnement', cat:'conge', abs:1},
  maladie:        {l:'Arrêt maladie', cat:'autre'},
  at:             {l:'Accident du travail', cat:'autre'},
  familial:       {l:'Congé pour événement familial', cat:'autre'},
  enfant:         {l:'Enfant malade', cat:'autre'},
  sanssolde:      {l:'Congé sans solde', cat:'autre'},
  absence:        {l:'Absence autre', cat:'autre'}
};
const MOTIFS = {
  medical:   {l:'Rendez-vous médical', c:false},
  medtravail:{l:'Visite médecine du travail', c:true},
  admin:     {l:'Démarche administrative', c:false},
  enfant:    {l:'Enfant', c:false},
  perso:     {l:'Rendez-vous personnel', c:false},
  convoc:    {l:'Convocation de l’employeur', c:true},
  formation: {l:'Formation obligatoire', c:true},
  autre:     {l:'Autre', c:false}
};
const tLabel = t => TYPES[t] ? TYPES[t].l : (t || '');
const tCat = t => (TYPES[t] || {}).cat || '';
const typeSelect = (attrs, val) => `<select ${attrs}>${Object.entries(CATS).map(([c, cl]) => `<optgroup label="${cl}">${Object.entries(TYPES).filter(([k, t]) => t.cat === c).map(([k, t]) => `<option value="${k}" ${val === k ? 'selected' : ''}>${t.l}</option>`).join('')}</optgroup>`).join('')}</select>`;
const motifSelect = (attrs, val) => `<select ${attrs}>${Object.entries(MOTIFS).map(([k, m]) => `<option value="${k}" ${val === k ? 'selected' : ''}>${m.l}</option>`).join('')}</select>`;
const FERIES = [['jan1','1er janvier'],['paques','Lundi de Pâques'],['mai1','1er mai'],['mai8','8 mai'],['ascension','Ascension'],['pentecote','Lundi de Pentecôte'],['jul14','14 juillet'],['aou15','15 août'],['nov1','Toussaint'],['nov11','11 novembre'],['dec25','Noël']];

/* ================= Données ================= */
const DEF_SET = {nom:'', employeur:'', poste:'', base:35, seuil:43, t1:25, t2:50, taux:0, contingent:220, grande:false, credit:false, creditH:7, remu:[], debut:'', fin:'', contrat:'CDI', convention:'', mode:'heures', fj:216, fjDebut:'01-01', rachat:15, rttOv:{}, cpUnit:'ouvrables', cpCal:{}, recupAdj:[], fChom:['jan1','paques','mai1','mai8','ascension','pentecote','jul14','aou15','nov1','nov11','dec25'], nuit:[{a:'21:00', z:'22:00', p:5}, {a:'22:00', z:'05:00', p:20}, {a:'05:00', z:'06:00', p:0}], dimReg:30, dimOcc:100, ferPct:100, ancGrid:[{y:10, j:1}, {y:15, j:2}, {y:20, j:3}], maskMotif:true, entretiens:[], alertes:[], fjOv:{}, kmAller:35, trajetMin:35, cv:5, elec:false, repasAuto:true, repasPrix:'', repasEmp:0, repasFoyer:5.45, repasLimite:'', niAnnuel:'', astMontant:0, jrPers:[], jrTaches:[], jrCats:[], jrPreuves:{}, jrBoucle:{}, updatedAt:''};
let S = load();
if ((S.settings.ancGrid || []).some(Array.isArray)) S.settings.ancGrid = S.settings.ancGrid.map(g => Array.isArray(g) ? {y:g[0], j:g[1]} : g);
function load() {
  try { const o = JSON.parse(localStorage.getItem('mh_data') || '{}'); return {settings:{...DEF_SET, ...(o.settings||{})}, days:o.days || {}, paie:o.paie || {}, dels:o.dels || {}, docs:o.docs || {}, clos:o.clos || {}, jr:o.jr || {}}; }
  catch (e) { return {settings:{...DEF_SET}, days:{}, paie:{}, dels:{}, docs:{}, clos:{}, jr:{}}; }
}
function persist() {
  try { localStorage.setItem('mh_data', JSON.stringify(S)); }
  catch (e) { toast("Enregistrement impossible sur l'appareil : exportez une sauvegarde."); }
}
const blankDay = ds => ({date:ds, type:'travail', segs:[], lieu:'', note:'', closed:false, createdAt:'', updatedAt:'', hist:[]});
function stamp(d) { const n = new Date().toISOString(); if (!d.createdAt) d.createdAt = n; d.updatedAt = n; }
const dt = (ds, hm) => { const x = pd(ds); const [h,m] = hm.split(':').map(Number); x.setHours(h, m, 0, 0); return x; };
const sorted = d => [...(d.segs||[])].sort((a,b) => toMin(a.d) - toMin(b.d));
function segEnd(ds, s) { if (!s.f) return null; const e = dt(ds, s.f); if (e < dt(ds, s.d)) e.setDate(e.getDate()+1); return e; }
function segMin(ds, s, now) {
  const st = dt(ds, s.d); const en = s.f ? segEnd(ds, s) : now;
  return en ? Math.max(0, Math.round((en - st)/60000)) : 0;
}
/* ================= Interventions, sollicitations (hors temps de travail) ================= */
const ITV_MOTIFS = {froid:'Alarme froid', securite:'Alarme intrusion / sécurité', panne:'Panne technique', direction:'Appel de la direction', autre:'Autre'};
const SOL_MOYENS = {appel:'Appel', sms:'SMS', mail:'Mail', messagerie:'Messagerie', autre:'Autre'};
function chainTimes(ds, list) { // heures successives, avec passage de minuit
  let prev = null;
  return list.map(t => {
    if (!t) return null; const x = dt(ds, t);
    if (prev) { while (x < prev) x.setDate(x.getDate() + 1); }
    prev = x; return x;
  });
}
function itvTimes(ds, v) {
  const [call, dep, arr, fin, ret] = chainTimes(ds, [v.call, v.dep, v.arr, v.fin, v.ret]);
  const st = dep || arr || call, en = ret || fin;
  return {call, dep, arr, fin, ret, st, en, min:st && en && en > st ? Math.round((en - st)/60000) : 0};
}
function solTimes(ds, v) { if (!v.t) return null; const st = dt(ds, v.t); return {st, en:new Date(st.getTime() + (+v.dur || 0)*60000), min:+v.dur || 0}; }
function extraIntervals(d) {
  const out = [];
  (d.itv || []).forEach(v => { const x = itvTimes(d.date, v); if (x.min) out.push([x.st, x.en, 'itv']); });
  (d.sol || []).forEach(v => { if (!v.c) return; const x = solTimes(d.date, v); if (x && x.min) out.push([x.st, x.en, 'sol']); });
  return out;
}
const extraMin = d => extraIntervals(d).reduce((a, x) => a + Math.round((x[1] - x[0])/60000), 0);
const itvMin = d => (d.itv || []).reduce((a, v) => a + itvTimes(d.date, v).min, 0);
const solMin = d => (d.sol || []).filter(v => v.c).reduce((a, v) => a + (+v.dur || 0), 0);
function workIntervals(d) { // toutes les périodes de travail effectif de la journée (dates réelles)
  const iv = [];
  for (const s of d.segs || []) if (s.f) iv.push([dt(d.date, s.d), segEnd(d.date, s)]);
  for (const g of dayAbs(d)) if (g.info.c) iv.push([dt(d.date, g.d), (() => { const e = dt(d.date, g.f); if (e < dt(d.date, g.d)) e.setDate(e.getDate()+1); return e; })()]);
  return iv.concat(extraIntervals(d).map(x => [x[0], x[1]]));
}
function extrasTxt(d, pub) {
  const out = [];
  (d.itv || []).forEach(v => { const x = itvTimes(d.date, v); out.push(`intervention ${v.dep || v.arr || v.call}–${v.ret || v.fin} (${fmt(x.min)}${v.km ? ', ' + v.km + ' km' : ''}${pub ? '' : ', ' + (ITV_MOTIFS[v.m] || 'autre')})`); });
  (d.sol || []).forEach(v => out.push(`${(SOL_MOYENS[v.moyen] || 'sollicitation').toLowerCase()} à ${v.t} (${v.dur || 0} min${v.c ? '' : ', non compté'})`));
  if (d.ast) out.unshift('astreinte');
  return out.join(', ');
}

function gaps(d) { // intervalles entre deux périodes : pauses ou absences
  const ss = sorted(d), out = [];
  for (let i = 0; i < ss.length-1; i++) {
    const e = segEnd(d.date, ss[i]); if (!e) continue;
    const m = Math.round((dt(d.date, ss[i+1].d) - e)/60000);
    if (m > 0) out.push({d:ss[i].f, f:ss[i+1].d, m, info:(d.gi || {})[ss[i].f] || null});
  }
  return out;
}
const isAbs = g => g.info && g.info.k === 'abs';
const dayAbs = d => gaps(d).filter(isAbs);
const dayEff = (d, now) => (d.segs||[]).reduce((a, s) => a + segMin(d.date, s, now), 0) + dayAbs(d).filter(g => g.info.c).reduce((a, g) => a + g.m, 0) + extraMin(d);
function dayPause(d) { return gaps(d).filter(g => !isAbs(g)).reduce((a, g) => a + g.m, 0); }
function dayParts(d) { // répartition de la journée en types (1 = journée, 0,5 = demi-journée)
  if (!d) return [];
  if (d.half) return [{t:d.am || 'travail', w:.5}, {t:d.pm || 'travail', w:.5}];
  if ((d.segs || []).length) return [{t:tCat(d.type) === 'travail' ? d.type : 'travail', w:1}];
  if (d.type === 'travail' && !d.q) return [];
  return [{t:d.type, w:1}];
}
const catUnits = (d, cat) => dayParts(d).filter(p => tCat(p.t) === cat).reduce((a, p) => a + p.w, 0);
const typeUnits = (d, t) => dayParts(d).filter(p => p.t === t).reduce((a, p) => a + p.w, 0);
const inContract = ds => { const st = S.settings; return (!st.debut || ds >= st.debut) && (!st.fin || ds <= st.fin); };
const contratTxt = () => { const st = S.settings; if (!st.debut && !st.fin) return ''; return (st.contrat || 'Contrat') + (st.debut ? ' depuis le ' + frNum(st.debut) : '') + (st.fin ? (st.debut ? ' jusqu’au ' : ' terminé le ') + frNum(st.fin) : ''); };
const dayCredit = d => S.settings.credit ? dayParts(d).filter(p => TYPES[p.t] && TYPES[p.t].abs).reduce((a, p) => a + p.w, 0) * S.settings.creditH*60 : 0;
function bounds(ds) {
  const d = S.days[ds]; if (!d || !d.segs.length) return null;
  const ss = sorted(d); return {st:dt(ds, ss[0].d), en:segEnd(ds, ss[ss.length-1])};
}
function weekRestOld(mon) { // ancien calcul (remplacé en v6)
  const iv = [];
  for (let i = -2; i < 9; i++) { const ds = addD(mon, i), d = S.days[ds]; if (!d) continue; workIntervals(d).forEach(x => iv.push(x)); }
  iv.sort((a, b) => a[0] - b[0]);
  const ws = dt(mon, '00:00'), we = dt(addD(mon, 7), '00:00');
  const inWeek = iv.filter(x => x[1] > ws && x[0] < we); if (!inWeek.length) return 99999;
  let max = 0, prevEnd = null;
  for (const [a, b] of iv) {
    if (prevEnd && a > prevEnd && prevEnd < we && a > ws) max = Math.max(max, (a - prevEnd)/60000);
    if (!prevEnd || b > prevEnd) prevEnd = b;
  }
  const first = inWeek[0][0], last = inWeek.reduce((m, x) => x[1] > m ? x[1] : m, inWeek[0][1]);
  const before = iv.filter(x => x[1] <= first).reduce((m, x) => !m || x[1] > m ? x[1] : m, null);
  const after = iv.filter(x => x[0] >= last).reduce((m, x) => !m || x[0] < m ? x[0] : m, null);
  max = Math.max(max, (first - (before || new Date(ws.getTime() - 864e5)))/60000, ((after || new Date(we.getTime() + 864e5)) - last)/60000);
  return Math.round(max);
}
function itvAlerts(ds) { // repos après une intervention
  const d = S.days[ds], out = []; if (!d || !(d.itv || []).length) return out;
  for (const v of d.itv) {
    const x = itvTimes(ds, v); if (!x.en) continue;
    const starts = [];
    for (const k of [ds, addD(ds, 1)]) { const dd = S.days[k]; if (dd) for (const s of dd.segs || []) { const st = dt(k, s.d); if (st > x.en) starts.push(st); } }
    if (starts.length) { const nx = starts.reduce((a, b) => a < b ? a : b); const r = (nx - x.en)/60000; if (r < 660) out.push(`Repos de ${fmt(r)} après l’intervention de ${v.dep || v.arr || v.call} (moins de 11 h)`); }
  }
  return out;
}
function dayAlerts(ds, now) {
  const d = S.days[ds]; const out = []; if (!d) return out; if (!d.segs.length) return itvAlerts(ds);
  const forfait = S.settings.mode === 'forfait';
  if (dayEff(d, now) > 600) out.push('Plus de 10 h travaillées' + (forfait ? ' (indicatif en forfait jours)' : ''));
  const b = bounds(ds);
  if (b && b.en && (b.en - b.st)/60000 > 780) out.push('Amplitude de ' + fmt((b.en - b.st)/60000) + ' (plus de 13 h)');
  const p = bounds(addD(ds, -1));
  if (b && p && p.en) { const r = (b.st - p.en)/60000, rq = reqDaily(); if (r < rq) out.push('Repos de ' + fmt(r) + ' depuis la veille (moins de ' + hTxt(rq) + (forfait && r < 660 ? ' ; sous le minimum légal de 11 h' : '') + ')'); }
  if (forfait && d.half && d.pm && tCat(d.pm) !== 'travail' && b && b.en && b.en > dt(ds, '13:30')) out.push('Après-midi noté en ' + tLabel(d.pm).toLowerCase() + ', mais travaillé jusqu’à ' + HMx(b.en) + ' : c’est une journée entière selon l’avenant n° 52 (une demi-journée finit au plus tard à 13 h 30)');
  else if (forfait && (d.half || (d.q && d.q < 1)) && dayWorkUnits(ds) === 1 && !(b && b.en && b.en <= dt(ds, '13:30') && addD(ds, 1) >= today())) out.push('Compté comme journée entière (avenant n° 52 : une demi-journée finit au plus tard à 13 h 30 et est suivie de 18 h de repos)');
  return out.concat(itvAlerts(ds));
}
function srcTxt(d) {
  const set = [...new Set((d.segs||[]).flatMap(s => s.srcF ? [s.src, s.srcF] : [s.src]))];
  if (!set.length) return d.type === 'travail' && !d.half ? '' : 'manuel';
  return set.length === 1 ? set[0] : set.join(' + ');
}
const segTxt = d => sorted(d).map(s => s.d + '–' + (s.f || '…')).join(', ');
const masked = t => S.settings.maskMotif && tCat(t) === 'autre' ? 'Autre absence' : tLabel(t);

function readSettingsV3() {

  const fd = ($('#s-fjd').value || '01/01').split('/'); st.fjDebut = pad(+fd[1] || 1) + '-' + pad(+fd[0] || 1);
  const p = fjPeriod(today()); st.rttOv = st.rttOv || {}; const ov = $('#s-rttov').value.trim(); if (ov === '') delete st.rttOv[p.start]; else st.rttOv[p.start] = numIn(ov);
  st.cpUnit = $('#s-cpu').value;

  st.cpCal = {date:$('#s-cd').value, n1:nv('#s-cn1'), n:nv('#s-cn'), anc:nv('#s-ca'), frac:nv('#s-cf')};
  st.fChom = [...document.querySelectorAll('.s-fc:checked')].map(x => x.value);

  st.nuit = a.map((x, i) => ({a:x.value, z:z[i].value, p:numIn(pc[i].value)})).filter(b => b.a && b.z);

  st.maskMotif = $('#s-mask').checked;
  st.fjOv = st.fjOv || {}; const fo = $('#s-fjov').value.trim(); if (fo === '') delete st.fjOv[p.start]; else st.fjOv[p.start] = numIn(fo);

}

  const rappels = mentions.filter(f => f.type === 'rappel'), wk = addD(today(), -6);

/* ================= Repos : moteur v6 (réel, vérifiable) =================
   Règles : repos quotidien 12 h en forfait jours (avenant n° 52 IDCC 2216), 11 h minimum légal ;
   repos hebdomadaire 36 h consécutives en forfait (24 h + 12 h), 35 h sinon ;
   forfait : 1 journée entière + 1 journée ou 2 demi-journées par semaine, demi-journées manquantes à prendre sous 3 mois ;

}

function restWeek(mon, nowArg) {

  if (!iv.some(x => x[1] > ws && x[0] < we)) {

    if (mid < ws || mid >= we) continue;
    const miss = gapKnown(e, s); if (miss.length) { r.missing.push(...miss); continue; }

  }

    const miss = gapKnown(last, now < we ? now : new Date(we.getTime() - 1)).filter(ds => ds <= today());
    if (!miss.length) r.open = {from:last, min:Math.round((Math.min(now, Math.max(now, last)) - last) / 60000)};
    else r.missing.push(...miss);
  }

  else if (r.open && r.open.min >= need) { r.state = 'ok'; r.min = r.open.min; r.from = r.open.from; r.to = null; }

/* Demi-journée au sens de l'avenant n° 52 */
function nightIn(ds) { const d = S.days[ds]; if (!d) return false; return workIntervals(d).some(([a, b]) => { for (let t = a.getTime(); t < b.getTime(); t += 15 * 60000) { const h = new Date(t).getHours(); if (h >= 21 || h < 6) return true; } return false; }); }

function reposDus(ref) { // demi-journées de repos hebdomadaire manquantes, prises et à prendre (forfait)
  ref = ref || today(); const st = S.settings; if (st.mode !== 'forfait' || !st.debut) return null;
  const weeks = []; for (let m = monday(st.debut); m <= ref; m = addD(m, 7)) { const w = weekForfait(m); if (addD(m, 6) <= ref || m === monday(ref)) weeks.push(w); }

    if (o.impEnd.length) w.line(`Fermetures du magasin : ${o.impEnd.length} jour(s) (${o.impEnd.map(frNum).join(', ')}).`); }
  w.gap(3); w.line('Repos (avenant n° 52 de la convention IDCC 2216)', {b:true, s:11.5});
  w.line(`Repos quotidiens de moins de 12 h : ${o.r12.length}${o.r12.length ? ' (' + o.r12.map(([ds, v]) => frNum(ds) + ' : ' + v).join(' ; ') + ')' : ''}${o.r11.length ? ', dont ' + o.r11.length + ' sous le minimum légal de 11 h' : ''}`);
  const badW = o.weeks.filter(x => restBad(x.r)); w.line(`Semaines sans 36 h de repos consécutives : ${badW.length} sur ${o.weeks.length}${badW.length ? ' (' + badW.map(x => 'semaine du ' + frNum(x.mon) + ' : ' + restTxt(x.r, true)).join(' ; ') + ')' : ''}`);
  if (st.mode === 'forfait') w.line(`Demi-journées de repos hebdomadaire manquantes (semaines terminées) : ${o.missHalf} (à prendre dans les 3 mois)`);
  { const c = bImpConflicts(o.first, o.end); if (bImp()) w.line(`Brief imposé à ${bImp().h}${bImp().par ? ' par ' + bImp().par : ''} ; jours concernés avec moins de 12 h de repos réel (pointages) depuis la fin de la veille : ${c.length}${c.length ? ' (' + c.map(([ds, r]) => frNum(ds) + ' : ' + fmt(r)).join(' ; ') + ')' : ''}`); }
  if (o.amp.length) w.line(`Amplitudes de plus de 13 h : ${o.amp.map(([ds, v]) => frNum(ds) + ' : ' + v).join(' ; ')}`);
  w.gap(3); w.line('Équipes', {b:true, s:11.5});
  w.line(`Briefs d’équipe : ${Object.keys(o.briefs).length ? Object.entries(o.briefs).map(([r, n]) => r + ' ' + n).join(', ') : 'aucun noté'}${o.dem.fait + o.dem.pasfait + o.dem.att ? ' · demandes : ' + o.dem.fait + ' faites, ' + o.dem.pasfait + ' pas faites, ' + o.dem.att + ' en attente' : ''}`);
  if (o.recap && o.recap.txt) { w.gap(3); w.line('Récapitulatif', {b:true, s:11.5}); w.line(o.recap.txt); }
  if (o.horaires.length) { w.gap(3); w.line('Horaires imposés', {b:true, s:11.5}); o.horaires.forEach(f => w.line('• ' + frNum(f.date) + (f.heure ? ' à ' + f.heure : '') + ' : ' + (releveNotes(f.date).split(' — ').find(x => x.includes(jrTitle(f).replace(/…$/, ''))) || jrTitle(f)))); }
  if (o.imp.length) { w.gap(3); w.line('Faits importants', {b:true, s:11.5}); o.imp.forEach(f => w.line('• ' + frNum(f.date) + (f.heure ? ' à ' + f.heure : '') + ' — ' + ((JR_TYPES[f.type] || {}).l || '') + (f.niv === 'litige' ? ' (litige)' : '') + ' : ' + jrTitle(f))); }
  pdfFooter(doc, 'Récapitulatif mensuel — Mes Heures');
  await deliver(doc.output('blob'), `Recap_${ym}.pdf`, 'application/pdf');
}

/* ================= Brief imposé (horaire du matin) ================= */
const bImp = () => { const b = S.settings.briefImp; return b && b.h ? b : null; };
function bImpOn(ds) { const b = bImp(); return !!(b && (!b.depuis || ds >= b.depuis) && !(b.jours && b.jours.length && !b.jours.includes(pd(ds).getDay()))); }
function bImpRest(ds) { // repos entre la fin de la veille et l'heure imposée du brief
  const b = bImp(); if (!b || !bImpOn(ds)) return null; const p = bounds(addD(ds, -1)), c = bounds(ds); if (!p || !p.en || !c || !c.st) return null;
  return (c.st - p.en) / 60000; // repos réel, d'après les pointages (même si l'arrivée est après l'heure du brief)
}
function htmlBImpWarn() { // sur Ma journée : prévenir le soir d'une fermeture
  const b = bImp(), t = today(), n = addD(t, 1); if (!b || !bImpOn(n)) return '';
  const bt = bounds(t); if (!bt || !bt.en) return '';
  const r = (dt(n, b.h) - bt.en) / 60000; if (r >= reqDaily()) return '';
  return `<div class="alert">Brief imposé demain à ${b.h}${b.par ? ' (' + esc(b.par) + ')' : ''} : avec ta fin à ${HMx(bt.en)} ce soir, ton repos ne serait que de ${fmt(r)}, sous les 12 h de l’avenant n° 52${r < 660 ? ' et sous le minimum légal de 11 h' : ''}. Pour 12 h de repos, reprise au plus tôt à ${HMx(new Date(bt.en.getTime() + reqDaily() * 60000))}.</div>`;
}
function bImpConflicts(first, last) { const out = []; for (let ds = first; ds <= last; ds = addD(ds, 1)) { const d = S.days[ds]; if (!d || !catUnits(d, 'travail')) continue; const r = bImpRest(ds); if (r !== null && r < reqDaily()) out.push([ds, r]); } return out; }
function htmlBImpSet() {
  const b = bImp() || {h:'', par:'', depuis:''};
  return `<div class="group"><div class="gh">Brief imposé</div><div class="gpad">
    <div class="two"><div><label class="l" for="bi-h">Heure imposée</label><input type="time" id="bi-h" value="${esc(b.h)}"></div><div><label class="l" for="bi-d">Depuis le</label><input type="date" id="bi-d" value="${esc(b.depuis || '')}"></div></div>
    <label class="l" for="bi-p">Imposé par</label><input type="text" id="bi-p" value="${esc(b.par || '')}" placeholder="Ex. M. Eude">
    <div class="btns two" style="margin-top:10px"><button class="btn ghost" data-act="bisave">Enregistrer</button>${b.h ? '<button class="btn ghost" data-act="bioff">Plus imposé</button>' : ''}</div>
    <p class="small muted">L’appli vérifie alors chaque jour le repos entre ta fin de la veille et l’heure du brief, et te prévient le soir d’une fermeture.</p></div></div>`;
}
const NEWT = 'M. Eude impose que le brief avec les équipes soit fait chaque matin à 7 h 45.\nJe dois donc être présent au magasin à 7 h 45 chaque jour travaillé : mon heure d’arrivée est fixée par la direction, je ne suis pas libre d’organiser mon emploi du temps.\nS’y ajoutent les fermetures du magasin (fin vers 20 h 15), également imposées.\nConséquence : un soir de fermeture suivi du brief de 7 h 45 ne laisse qu’environ 11 h 30 de repos, sous les 12 h de l’avenant n° 52.\nDate à laquelle ce brief a été imposé : (à compléter).';
function mig10c() {
  const st = S.settings, now = new Date().toISOString();
  if (!st.briefImp) st.briefImp = {h:'07:45', par:'M. Eude', depuis:st.debut || ''};
  if (!S.jr.jx2611briefimp) {
    S.jr.jx2611briefimp = {id:'jx2611briefimp', type:'horaire', niv:'imp', date:'2026-11-26', heure:'', titre:'Heure d’arrivée imposée : brief d’équipe obligatoire chaque matin à 7 h 45',
      texte:NEWT,

    try { pushJr('jx2611briefimp'); } catch (e) {}
  }
  st.mig10c = true; st.updatedAt = now; persist(); try { pushSettings(); } catch (e) {}
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, st = S.settings;
  if (a === 'bisave') { const h = $('#bi-h').value; if (!h) return toast('Indiquez l’heure du brief.'); st.briefImp = {h, par:$('#bi-p').value.trim(), depuis:$('#bi-d').value}; brSetSettings(); toast('Brief imposé enregistré'); keepScroll(render); }

function halfHint(st, now) { if (st.k === 'on') return ''; const y = addD(today(), -1), yd = S.days[y], yb = bounds(y); if (!yd || !yd.half || !yd.pm || tCat(yd.pm) === 'travail' || !yb || !yb.en || yb.en > dt(y, '13:30') || (bounds(today()) || {}).st) return ''; const lim = new Date(yb.en.getTime() + 1080 * 60000); return now < lim ? `<div class="alert">Demi-journée d’hier (après-midi ${esc(tLabel(yd.pm).toLowerCase())}) : pour qu’elle compte, il faut 18 h de repos après ton départ de ${HMx(yb.en)}, donc ne pas pointer avant <b>${HMx(lim)}</b> (avenant n° 52). Avant, elle compterait comme une journée entière.</div>` : `<div class="alert">18 h de repos atteintes depuis hier ${HMx(yb.en)} : la demi-journée d’hier compte bien comme une demi-journée.</div>`; }
